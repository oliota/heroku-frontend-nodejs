<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#2d2a4a" />
    <meta
      name="description"
      content="Adedonha — STOP! Gire a roda, encontre as palavras e jogue com seus amigos."
    />
    <title>Adedonha — STOP!</title>
    <link rel="icon" href="/adedonha/assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/adedonha/css/app.css" />
    <link rel="stylesheet" href="/adedonha/css/wheel.css" />
    <script src="/adedonha/runtime-config.js"></script>
    <script type="module" src="/adedonha/js/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#screen">Ir para o jogo</a>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="#home" aria-label="Adedonha, início"
          ><span class="brand-icon">A<span>!</span></span
          ><span>ADEDONHA<small>O clássico das palavras.</small></span></a
        >
        <nav aria-label="Navegação principal">
          <a class="header-site-link" href="https://oliota.com" target="_blank" rel="noopener noreferrer" aria-label="Visitar oliota.com">oliota.com ↗</a>
          <button id="layout-mode" class="profile-button layout-mode-button" type="button" title="Alternar visualização desktop/mobile">Modo mobile</button>
          <button
            id="friends-nav"
            class="icon-button"
            title="Amigos"
            aria-label="Amigos"
          >
            ♧<span id="friends-badge" class="badge" hidden></span>
          </button>
          <button id="profile-nav" class="profile-button" aria-label="Perfil">
            ◎ <span>Perfil</span>
          </button>
        </nav>
      </header>
      <div id="connection" class="connection" role="status" hidden></div>
      <main id="screen" tabindex="-1">
        <div class="loading-wheel" role="status" aria-label="A carregar"><div class="loading-wheel-disc" aria-hidden="true"></div><span>A carregar…</span></div>
      </main>
    </div>
    <div id="online-busy" class="online-busy" role="status" aria-live="polite" hidden>
      <div class="busy-panel"><span class="busy-spinner" aria-hidden="true"></span><strong id="busy-message">Processando…</strong></div>
    </div>
    <div id="notifications" aria-live="polite" aria-atomic="true"></div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <noscript>Ative o JavaScript para jogar Adedonha.</noscript>
  </body>
</html>
